[project]
name = "SmartMDAO"
version = "1.16.0"
description = "Extensible MDAO framework with zero boilerplate integration and plug-and-play optimization."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "h5py>=3.15.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# SciPy stays a hard dependency: it is the default optimizer backend and the
# one most users will reach for. OpenTURNS is a large install that only the
# `openturns` backend needs, and `OpenTURNSBackend.solve` already imports it
# lazily - so it is opt-in.
openturns = [
    "openturns>=1.27",
]
# The MCP server is opt-in: the SDK pulls in ~27 transitive packages
# (starlette, uvicorn, cryptography, pydantic) that a library user running
# an MDAO study has no use for. `smartmdao.mcp` lazily imports it.
mcp = [
    "mcp>=2.2.0",
]
# Rule-backed disciplines (docs/design/004). clingo declares one dependency,
# cffi, which brings pycparser - three packages, not the "zero transitive
# dependencies" 003 claimed before anyone measured it. Still negligible, and
# `smartmdao.rules` imports it lazily so a base install fails only at the point
# a program is actually solved.
asp = [
    "clingo>=5.8.0",
]

[project.scripts]
smartmdao-mcp = "smartmdao.mcp.server:main"

[dependency-groups]
dev = [
    "h5py>=3.15.1",
    "pytest>=9.0.1",
    "pytest-cov>=7.1.0",
    # Every extra is present in dev so the full suite runs and 100% coverage is
    # reachable. None of them is in the base install.
    "mcp>=2.2.0",
    "openturns>=1.27",
    "clingo>=5.8.0",
    # Notebook kernel for local experimentation. Nothing in smartmdao/ imports
    # it; it was a runtime dependency until 1.8.0, which meant every install
    # dragged in 14 packages (a debugger, a Jupyter kernel, ZeroMQ, Tornado).
    "ipykernel>=7.1.0",
]

# The cookbook is served by the MCP `smartmdao_cookbook` tool, so it has to
# travel in the wheel - not just live in the repo. Without this, an installed
# user gets the tool and none of the content.
[tool.hatch.build.targets.wheel.force-include]
"docs/cookbook.md" = "smartmdao/mcp/cookbook.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
