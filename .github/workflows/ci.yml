name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: uv run pytest tests/

      # run_all.py is half of the Definition of Done in docs/handoff.md and had
      # never actually been enforced. MPLBACKEND=Agg is load-bearing here: some
      # scripts render a diagram, and plt.show() on an interactive backend would
      # block a runner forever rather than failing.
      - name: Run every script
        env:
          MPLBACKEND: Agg
        run: uv run python run_all.py

      # The notebooks are committed WITH their outputs so GitHub renders them.
      # Re-executing here is what stops them drifting away from the library: a
      # notebook whose code no longer matches fails the build instead of sitting
      # there looking authoritative.
      - name: Execute notebooks
        env:
          MPLBACKEND: Agg
        run: uv run python run_notebooks.py

  # Definition of Done item 1, enforced: a PR that changes smartmdao/ must
  # change docs/ too, or say why not with "Docs: not needed — <reason>" in its
  # body. The same script backs the pre-push and Claude Code hooks.
  docs-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the merge base with main has to be reachable

      - name: Docs updated, or waived with a reason
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/docs_gate.py --ci --base "origin/$BASE_REF"

  # The version in pyproject.toml, its git tag and its GitHub Release, kept in
  # step. Runs on main only, after the tests pass on the merge commit: a new
  # version is tagged there and released; an existing tag with no Release gets
  # one. Bumping the version in a PR is the only manual step. See
  # tools/release.py for why this stopped being left to memory.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags have to be visible to be found

      - name: Tag and release the version, if it is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py --sha "$GITHUB_SHA"

  # Upload the version just released to PyPI, by trusted publishing: PyPI
  # trusts this workflow and the `pypi` environment, so there is no token to
  # store or leak. The environment's required reviewer approves each upload -
  # tags and Releases are automatic, but an upload cannot be taken back.
  publish:
    if: needs.release.outputs.released == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/SmartMDAO/
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build the wheel and sdist
        run: uv build

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true     # a rerun must not fail on a version already there
