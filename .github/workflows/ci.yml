name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: uv run pytest tests/

      # The notebooks are committed WITH their outputs so GitHub renders them.
      # Re-executing here is what stops them drifting away from the library: a
      # notebook whose code no longer matches fails the build instead of sitting
      # there looking authoritative.
      - name: Execute notebooks
        env:
          MPLBACKEND: Agg
        run: uv run python run_notebooks.py
